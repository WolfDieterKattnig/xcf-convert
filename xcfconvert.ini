# ============================================
#  Konfiguration fuer xcfconvert.bat
#  (Leerzeichen um das '=' vermeiden)
# ============================================

# Pfad zu GIMP 3 (Batch-Variante ohne Bildschirmaufbau):
gimp_path=C:\Program Files\GIMP 3\bin\gimp-console-3.exe

# Standard-Exportformat, wenn --format nicht angegeben wird.
# Unterstuetzt wird alles, was GIMP exportieren kann, z.B.:
#   png, jpg, jpeg, tif, tiff, bmp, webp, jxl, dcm, txt, ...
format=png
